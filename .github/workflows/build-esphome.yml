name: Validate Robot007 ESPHome firmware

on:
  push:
    paths:
      - "esphome/**"
      - ".github/workflows/build-esphome.yml"
  pull_request:
    paths:
      - "esphome/**"
      - ".github/workflows/build-esphome.yml"
  workflow_dispatch:

jobs:
  validate-and-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install ESPHome
        run: python -m pip install --upgrade esphome
      - name: Create temporary build secrets
        run: |
          cat > esphome/secrets.yaml <<'EOF'
          wifi_ssid: "BuildValidationNetwork"
          wifi_password: "validation-password"
          robot007_fallback_password: "validation-fallback-password"
          EOF
      - name: Validate ESPHome configuration
        run: esphome config esphome/robot007.yaml
      - name: Compile ESP32 firmware
        run: esphome compile esphome/robot007.yaml
